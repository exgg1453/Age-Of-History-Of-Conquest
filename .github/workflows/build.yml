name: Build APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Create release keystore
        run: |
          mkdir -p android/keystore
          keytool -genkeypair -v \
            -keystore android/keystore/release.keystore \
            -alias aohc \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass aohc_open_source \
            -keypass aohc_open_source \
            -dname "CN=Age Of History Of Conquest, OU=Community, O=Open Source, L=Internet, S=Internet, C=TR"

      - name: Build all variants
        run: |
          gradle :android:assembleNormalDebug :android:assembleNormalRelease \
                 :android:assembleLiteDebug :android:assembleLiteRelease \
                 --stacktrace 2>&1 | tee build.log

      - name: Report APK sizes
        if: success()
        run: |
          echo "### APK sizes" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Variant | Size |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          find android/build/outputs/apk -name "*.apk" | sort | while read -r apk; do
            size=$(du -h "$apk" | cut -f1)
            echo "| $(basename "$apk") | ${size}B |" >> $GITHUB_STEP_SUMMARY
          done

      - name: Upload normal debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: normal-debug-apk
          path: android/build/outputs/apk/normal/debug/*.apk
          if-no-files-found: error

      - name: Upload normal release APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: normal-release-apk
          path: android/build/outputs/apk/normal/release/*.apk
          if-no-files-found: error

      - name: Upload lite debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: lite-debug-apk
          path: android/build/outputs/apk/lite/debug/*.apk
          if-no-files-found: error

      - name: Upload lite release APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: lite-release-apk
          path: android/build/outputs/apk/lite/release/*.apk
          if-no-files-found: error

      - name: Write error report
        if: failure()
        run: |
          mkdir -p error-report
          {
            echo "Build failed for commit ${GITHUB_SHA}"
            echo "Workflow run ${GITHUB_RUN_ID}"
            echo ""
            echo "===== BUILD LOG ====="
            if [ -f build.log ]; then tail -n 500 build.log; else echo "not produced"; fi
          } > error-report/error.txt

      - name: Upload error report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: error-report
          path: error-report/error.txt
          if-no-files-found: warn
